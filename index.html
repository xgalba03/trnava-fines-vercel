<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trnava Fines MVP</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f4f6f8;
        color: #17202a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 2rem 1rem;
      }

      main {
        width: min(100%, 40rem);
        margin: 0 auto;
        padding: 2rem;
        background: #ffffff;
        border: 1px solid #dfe5eb;
        border-radius: 8px;
        box-shadow: 0 12px 30px rgb(23 32 42 / 8%);
      }

      h1 {
        margin: 0;
      }

      p {
        margin: 0.5rem 0 1.5rem;
        color: #52606d;
      }

      form {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: 1fr 8rem auto;
      }

      input,
      button {
        box-sizing: border-box;
        min-height: 2.5rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid #b8c2cc;
        border-radius: 4px;
        font: inherit;
      }

      button {
        border-color: #17202a;
        background: #17202a;
        color: #ffffff;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      #status {
        min-height: 1.5rem;
        margin: 1rem 0 0;
      }

      ul {
        padding: 0;
        margin: 1rem 0 0;
        list-style: none;
      }

      li {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 0;
        border-top: 1px solid #e6eaee;
      }

      @media (max-width: 36rem) {
        form {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Trnava Fines</h1>
      <p>Add a fine below. It is saved to the database and loaded back onto this page.</p>
      <form id="fine-form">
        <input name="description" placeholder="What happened?" required maxlength="120" />
        <input name="amount" type="number" min="0.01" step="0.01" placeholder="Amount" required />
        <button type="submit">Add fine</button>
      </form>
      <p id="status" role="status"></p>
      <ul id="fines"></ul>
    </main>
    <script>
      const form = document.querySelector('#fine-form');
      const status = document.querySelector('#status');
      const fines = document.querySelector('#fines');

      function render(items) {
        fines.replaceChildren(...items.map((fine) => {
          const item = document.createElement('li');
          const description = document.createElement('span');
          const amount = document.createElement('strong');
          description.textContent = fine.description;
          amount.textContent = Number(fine.amount).toFixed(2);
          item.append(description, amount);
          return item;
        }));
      }

      async function loadFines() {
        const response = await fetch('/api/fines');
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        render(data.fines);
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = form.querySelector('button');
        button.disabled = true;
        status.textContent = 'Saving...';
        try {
          const response = await fetch('/api/fines', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.fromEntries(new FormData(form)))
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error);
          form.reset();
          render(data.fines);
          status.textContent = 'Saved.';
        } catch (error) {
          status.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });

      loadFines().catch((error) => { status.textContent = error.message; });
    </script>
  </body>
</html>
