<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trnava Fines MVP</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f4f6f8;
        color: #17202a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 2rem 1rem;
      }

      main {
        width: min(100%, 40rem);
        margin: 0 auto;
        padding: 2rem;
        background: #ffffff;
        border: 1px solid #dfe5eb;
        border-radius: 8px;
        box-shadow: 0 12px 30px rgb(23 32 42 / 8%);
      }

      section[hidden] {
        display: none;
      }

      #fine-entry[hidden] {
        display: none;
      }

      #auth-form,
      #password-form,
      #app {
        display: grid;
        gap: 0.75rem;
      }

      #auth-form,
      #password-form {
        grid-template-columns: 1fr 1fr auto;
      }

      #auth,
      #password-settings {
        margin: 1rem 0;
        padding: 1rem;
        border: 1px solid #dfe5eb;
        border-radius: 4px;
      }

      #password-settings[hidden] {
        display: none;
      }

      #app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      #logout {
        min-height: 2rem;
        padding: 0.25rem 0.6rem;
        background: #ffffff;
        color: #17202a;
      }

      #login {
        min-height: 2rem;
        padding: 0.25rem 0.6rem;
      }

      h1 {
        margin: 0;
      }

      p {
        margin: 0.5rem 0 1.5rem;
        color: #52606d;
      }

      form {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: 1fr 8rem auto;
      }

      #fine-form {
        grid-template-columns: 10rem 1fr 8rem auto;
      }

      input,
      select,
      button {
        box-sizing: border-box;
        min-height: 2.5rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid #b8c2cc;
        border-radius: 4px;
        font: inherit;
      }

      button {
        border-color: #17202a;
        background: #17202a;
        color: #ffffff;
        cursor: pointer;
      }

      button.secondary {
        background: #ffffff;
        color: #17202a;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      #status {
        min-height: 1.5rem;
        margin: 1rem 0 0;
      }

      ul {
        padding: 0;
        margin: 1rem 0 0;
        list-style: none;
      }

      li {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 0;
        border-top: 1px solid #e6eaee;
      }

      @media (max-width: 36rem) {
        #auth-form,
        #password-form {
          grid-template-columns: 1fr;
        }

        form,
        #fine-form {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section id="app">
        <div id="app-header">
          <h1>Trnava Fines</h1>
          <div>
            <button id="login" type="button">Login</button>
            <button id="logout" type="button" hidden>Log out</button>
          </div>
        </div>
        <section id="auth" hidden>
          <p>Admin access is required to manage fines.</p>
          <form id="auth-form">
            <input name="email" type="email" placeholder="Your email" autocomplete="username" required />
            <input name="password" type="password" placeholder="Password" autocomplete="current-password" required />
            <button type="submit">Log in</button>
          </form>
          <button id="magic-link" class="secondary" type="button">Send one-time setup link</button>
          <p id="auth-status" role="status"></p>
        </section>
        <div id="fine-entry" hidden>
          <p>Add a fine below. It is saved to the database.</p>
          <form id="fine-form">
            <select name="player_id" aria-label="Player" required disabled>
              <option value="">Loading players...</option>
            </select>
            <input name="description" placeholder="What happened?" required maxlength="120" />
            <input name="amount" type="number" min="0.01" step="0.01" placeholder="Amount" required />
            <button type="submit">Add fine</button>
          </form>
        </div>
        <section id="password-settings" hidden>
          <p>Set or change the password for future admin logins.</p>
          <form id="password-form">
            <input name="password" type="password" minlength="12" placeholder="New password" autocomplete="new-password" required />
            <input name="confirmation" type="password" minlength="12" placeholder="Confirm password" autocomplete="new-password" required />
            <button type="submit">Save password</button>
          </form>
          <p id="password-status" role="status"></p>
        </section>
        <p>Recent fines</p>
        <p id="status" role="status"></p>
        <ul id="fines"></ul>
      </section>
    </main>
    <script>
      const auth = document.querySelector('#auth');
      const authForm = document.querySelector('#auth-form');
      const authStatus = document.querySelector('#auth-status');
      const fineEntry = document.querySelector('#fine-entry');
      const login = document.querySelector('#login');
      const logout = document.querySelector('#logout');
      const magicLink = document.querySelector('#magic-link');
      const passwordSettings = document.querySelector('#password-settings');
      const passwordForm = document.querySelector('#password-form');
      const passwordStatus = document.querySelector('#password-status');
      const form = document.querySelector('#fine-form');
      const playerSelect = form.elements.player_id;
      const status = document.querySelector('#status');
      const fines = document.querySelector('#fines');

      let accessToken = localStorage.getItem('trnava_access_token');
      let refreshToken = localStorage.getItem('trnava_refresh_token');
      let expiresAt = localStorage.getItem('trnava_expires_at');

      function updateAuthUi(loggedIn, showForm = false) {
        auth.hidden = loggedIn || !showForm;
        fineEntry.hidden = !loggedIn;
        passwordSettings.hidden = !loggedIn;
        login.hidden = loggedIn;
        logout.hidden = !loggedIn;
      }

      function saveSession(session) {
        accessToken = session?.access_token || null;
        refreshToken = session?.refresh_token || null;
        expiresAt = session?.expires_at ? String(session.expires_at) : null;

        if (accessToken) localStorage.setItem('trnava_access_token', accessToken);
        else localStorage.removeItem('trnava_access_token');
        if (refreshToken) localStorage.setItem('trnava_refresh_token', refreshToken);
        else localStorage.removeItem('trnava_refresh_token');
        if (expiresAt) localStorage.setItem('trnava_expires_at', expiresAt);
        else localStorage.removeItem('trnava_expires_at');
      }

      function clearSession() {
        saveSession(null);
        updateAuthUi(false);
      }

      function showLogin(message) {
        clearSession();
        updateAuthUi(false, true);
        authStatus.textContent = message || '';
      }

      async function readJson(response) {
        const text = await response.text();
        if (!text) return {};
        try {
          return JSON.parse(text);
        } catch {
          return { error: 'The server returned an invalid response.' };
        }
      }

      async function refreshSession() {
        if (!refreshToken) return false;

        const response = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'refresh', refresh_token: refreshToken })
        });
        const data = await readJson(response);
        if (!response.ok || !data.session) {
          clearSession();
          return false;
        }

        saveSession(data.session);
        updateAuthUi(true);
        return true;
      }

      async function validateSession() {
        if (!accessToken) {
          updateAuthUi(false);
          return false;
        }

        const response = await fetch('/api/auth', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        if (response.ok) {
          updateAuthUi(true);
          return true;
        }

        return refreshSession();
      }

      async function authorizedFetch(url, options) {
        const send = () => fetch(url, {
          ...options,
          headers: {
            ...(options.headers || {}),
            Authorization: `Bearer ${accessToken}`
          }
        });

        let response = await send();
        if (response.status === 401 && await refreshSession()) response = await send();
        return response;
      }

      function render(items) {
        fines.replaceChildren(...items.map((fine) => {
          const item = document.createElement('li');
          const description = document.createElement('span');
          const amount = document.createElement('strong');
          const relatedPlayer = Array.isArray(fine.player) ? fine.player[0] : fine.player;
          description.textContent = relatedPlayer?.name
            ? `${relatedPlayer.name}: ${fine.description}`
            : fine.description;
          amount.textContent = Number(fine.amount).toFixed(2);
          item.append(description, amount);
          return item;
        }));
      }

      async function loadFines() {
        const response = await fetch('/api/fines');
        const data = await readJson(response);
        if (!response.ok) throw new Error(data.error || 'Unable to load fines.');
        render(data.fines || []);
      }

      async function loadPlayers() {
        const response = await fetch('/api/players');
        const data = await readJson(response);
        if (!response.ok) throw new Error(data.error || 'Unable to load players.');

        const options = (data.players || []).map((player) => {
          const option = document.createElement('option');
          option.value = String(player.id);
          option.textContent = player.jersey_number === null
            ? player.name
            : `${player.name} #${player.jersey_number}`;
          return option;
        });

        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = options.length ? 'Select player' : 'No active players';
        playerSelect.replaceChildren(placeholder, ...options);
        playerSelect.disabled = options.length === 0;
      }

      authForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = event.submitter;
        button.disabled = true;
        authStatus.textContent = 'Logging in...';
        try {
          const body = Object.fromEntries(new FormData(authForm));
          body.action = 'login';
          const response = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const data = await readJson(response);
          if (!response.ok || !data.session) throw new Error(data.error || 'Login failed.');
          saveSession(data.session);
          updateAuthUi(true);
          authForm.reset();
          authStatus.textContent = '';
          status.textContent = 'Logged in as administrator.';
        } catch (error) {
          authStatus.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });

      magicLink.addEventListener('click', async () => {
        const email = authForm.elements.email.value.trim();
        if (!email) {
          authStatus.textContent = 'Enter your admin email first.';
          authForm.elements.email.focus();
          return;
        }

        magicLink.disabled = true;
        authStatus.textContent = 'Requesting setup link...';
        try {
          const response = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'magic_link', email })
          });
          const data = await readJson(response);
          if (!response.ok) throw new Error(data.error || 'Unable to request a setup link.');
          authStatus.textContent = data.message;
        } catch (error) {
          authStatus.textContent = error.message;
        } finally {
          magicLink.disabled = false;
        }
      });

      passwordForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = event.submitter;
        const body = Object.fromEntries(new FormData(passwordForm));
        if (body.password !== body.confirmation) {
          passwordStatus.textContent = 'The passwords do not match.';
          return;
        }

        button.disabled = true;
        passwordStatus.textContent = 'Saving...';
        try {
          const response = await authorizedFetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'set_password', password: body.password })
          });
          const data = await readJson(response);
          if (!response.ok) {
            if (response.status === 401 || response.status === 403) showLogin(data.error);
            throw new Error(data.error || 'Unable to save the password.');
          }
          passwordForm.reset();
          passwordStatus.textContent = data.message;
        } catch (error) {
          passwordStatus.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });

      login.addEventListener('click', () => {
        auth.hidden = !auth.hidden;
        authStatus.textContent = '';
        if (!auth.hidden) authForm.elements.email.focus();
      });

      logout.addEventListener('click', async () => {
        const previousAccessToken = accessToken;
        const previousRefreshToken = refreshToken;
        clearSession();
        status.textContent = '';
        try {
          await fetch('/api/auth', {
            method: 'DELETE',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${previousAccessToken}`
            },
            body: JSON.stringify({ refresh_token: previousRefreshToken })
          });
        } finally {
          loadFines().catch((error) => { status.textContent = error.message; });
        }
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = form.querySelector('button');
        button.disabled = true;
        status.textContent = 'Saving...';
        try {
          const response = await authorizedFetch('/api/fines', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.fromEntries(new FormData(form)))
          });
          const data = await readJson(response);
          if (!response.ok) {
            if (response.status === 401 || response.status === 403) showLogin(data.error);
            throw new Error(data.error || 'Unable to save the fine.');
          }
          form.reset();
          render(data.fines || []);
          status.textContent = 'Saved.';
        } catch (error) {
          status.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });

      async function initialize() {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const hashAccessToken = hashParams.get('access_token');
        const hashRefreshToken = hashParams.get('refresh_token');
        const hashExpiresAt = hashParams.get('expires_at');
        const hashError = hashParams.get('error_description');

        if (hashAccessToken) {
          saveSession({
            access_token: hashAccessToken,
            refresh_token: hashRefreshToken,
            expires_at: hashExpiresAt
          });
        }
        if (hashAccessToken || hashError) {
          window.history.replaceState({}, document.title, window.location.pathname + window.location.search);
        }

        if (hashError) showLogin(hashError);
        else await validateSession();

        await Promise.all([loadPlayers(), loadFines()]);
      }

      initialize().catch((error) => { status.textContent = error.message; });
    </script>
  </body>
</html>
