<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trnava Fines</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f4f6f8;
        color: #17202a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        max-width: 36rem;
        padding: 3rem;
        text-align: center;
        background: #ffffff;
        border: 1px solid #dfe5eb;
        border-radius: 8px;
        box-shadow: 0 12px 30px rgb(23 32 42 / 8%);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 2.5rem;
      }

      p {
        margin: 0;
        color: #52606d;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from Vercel</h1>
      <p>The Trnava fines project is deployed and running.</p>
    </main>
  </body>
</html>
